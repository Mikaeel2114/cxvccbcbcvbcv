name: Build ApexBan

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build all platform jars
        run: gradle --no-daemon --stacktrace clean dist

      - name: Upload Bukkit / Spigot / Paper jar
        uses: actions/upload-artifact@v4
        with:
          name: ApexBan-Bukkit
          path: build/dist/ApexBan-Bukkit-*.jar
          if-no-files-found: error

      - name: Upload BungeeCord jar
        uses: actions/upload-artifact@v4
        with:
          name: ApexBan-Bungee
          path: build/dist/ApexBan-Bungee-*.jar
          if-no-files-found: error

      - name: Upload Velocity jar
        uses: actions/upload-artifact@v4
        with:
          name: ApexBan-Velocity
          path: build/dist/ApexBan-Velocity-*.jar
          if-no-files-found: error

      - name: Publish a GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/ApexBan-*.jar
          generate_release_notes: true
