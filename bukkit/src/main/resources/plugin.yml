name: ApexBan
version: ${version}
main: dev.apexban.bukkit.ApexBanBukkit
api-version: '1.13'
authors: [ApexBan]
description: Enterprise moderation core - bans, mutes and kicks with a network-wide database.
website: https://github.com/
commands:
  ban:
    description: Ban a player permanently or temporarily
    usage: /<command> <player> [duration] [reason...]
  mute:
    description: Mute a player permanently or temporarily
    usage: /<command> <player> [duration] [reason...]
  kick:
    description: Kick a player
    usage: /<command> <player> [reason...]
  unban:
    description: Lift a ban
    usage: /<command> <player>
    aliases: [pardon]
  unmute:
    description: Lift a mute
    usage: /<command> <player>
  apexban:
    description: ApexBan administration
    usage: /<command> [reload|version|help]
    aliases: [apexb]
permissions:
  apexban.*:
    description: All ApexBan permissions
    default: op
    children:
      apexban.ban: true
      apexban.mute: true
      apexban.kick: true
      apexban.unban: true
      apexban.unmute: true
      apexban.admin: true
      apexban.notify: true
      apexban.exempt: true
  apexban.ban:
    description: Use /ban
    default: op
  apexban.mute:
    description: Use /mute
    default: op
  apexban.kick:
    description: Use /kick
    default: op
  apexban.unban:
    description: Use /unban
    default: op
  apexban.unmute:
    description: Use /unmute
    default: op
  apexban.admin:
    description: Use /apexban (reload, version)
    default: op
  apexban.notify:
    description: See punishment announcements
    default: op
  apexban.exempt:
    description: Cannot be banned, muted or kicked
    default: false
